services:
  - type: web
    name: floorplan-furniture-detect
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL_ID
        sync: false
      - key: CONF_THRESHOLD
        value: "0.5"
      - key: IOU_THRESHOLD
        value: "0.45"
      - key: ALLOWED_ORIGINS
        value: "*"
